<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARC3 Inference and Score Comparison</title>
  <style>
    :root {
      --bg:#f5f1e8; --panel:#fffaf1; --ink:#18242d; --muted:#6f7f88;
      --line:#d8cdbb; --accent:#c55d1f; --base:#647985; --frontier:#7456a4;
      --good:#25705a; --bad:#a34135; --shadow:0 18px 45px #18242d14;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; padding:16px; color:var(--ink); font-family:"Segoe UI",sans-serif;
      background:radial-gradient(circle at top left,#fff4dc,transparent 32rem),var(--bg);
    }
    main { max-width:1450px; margin:auto; display:grid; gap:14px; }
    .top,.panel {
      background:#fffaf1f5; border:1px solid #18242d14; border-radius:18px;
      box-shadow:var(--shadow);
    }
    .top { padding:18px 22px; display:flex; justify-content:space-between; gap:18px; align-items:center; }
    .panel { padding:18px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:4px; font-size:clamp(1.5rem,3vw,2.3rem); letter-spacing:-.04em; }
    h2 { margin-bottom:4px; font-size:1rem; text-transform:uppercase; letter-spacing:.08em; }
    h3 { margin-bottom:4px; font-size:.92rem; }
    a { color:inherit; }
    .muted,.note { color:var(--muted); }
    .back,.pill,select {
      border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink);
      padding:9px 14px; font:inherit;
    }
    .back { text-decoration:none; font-weight:700; white-space:nowrap; }
    .selectors {
      display:grid; grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr) minmax(145px,.55fr);
      gap:10px; align-items:end;
    }
    .select-wrap { display:grid; gap:5px; }
    .select-wrap label { color:var(--muted); font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    select { width:100%; min-width:0; }
    .pill { cursor:pointer; font-weight:700; }
    .hero { display:grid; grid-template-columns:minmax(290px,.9fr) minmax(0,2.1fr); gap:14px; }
    .score {
      padding:22px; border-radius:18px; color:#fff;
      background:linear-gradient(140deg,#21313a,#17232b); display:grid; align-content:center;
      min-height:240px;
    }
    .eyebrow { text-transform:uppercase; letter-spacing:.1em; font-size:.7rem; font-weight:700; opacity:.7; }
    .score-line { display:flex; align-items:baseline; gap:12px; margin:12px 0 8px; }
    .score-old { font-size:1.4rem; opacity:.6; }
    .score-new { color:#ffd6b6; font-size:clamp(2.7rem,6vw,4.7rem); font-weight:800; letter-spacing:-.07em; }
    .score-change { color:#a9ecd4; font-weight:700; }
    .run-names {
      margin-top:16px; padding-top:14px; border-top:1px solid #ffffff26;
      display:grid; gap:5px; font:11px/1.5 monospace; overflow-wrap:anywhere;
    }
    .kpis,.score-sources { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .kpi,.source-card { padding:15px; border-radius:15px; background:var(--panel); border:1px solid #18242d14; }
    .source-card.active { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
    .source-values { display:flex; align-items:baseline; gap:8px; margin-top:9px; }
    .source-values strong { font-size:1.55rem; }
    .label { color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; font-weight:700; }
    .value { margin-top:8px; font-size:1.5rem; font-weight:800; }
    .change { margin-top:4px; font-size:.82rem; font-weight:700; }
    .good { color:var(--good); } .bad { color:var(--bad); }
    .outcomes { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .outcome { padding:14px; border-radius:14px; background:#18242d09; }
    .outcome .value { font-size:1.35rem; }
    .head { display:flex; justify-content:space-between; align-items:end; gap:14px; margin-bottom:14px; }
    .metric-tabs { display:flex; gap:7px; flex-wrap:wrap; }
    .metric-tab {
      border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink);
      padding:7px 11px; cursor:pointer; font:inherit; font-size:.78rem;
    }
    .metric-tab.active { border-color:var(--accent); background:#f7dcc6; font-weight:700; }
    .game-chart,.opportunity-chart { display:grid; gap:5px; padding-right:4px; }
    .game-chart { max-height:680px; overflow:auto; }
    .game-row {
      display:grid; grid-template-columns:145px 80px minmax(180px,1fr) 80px;
      gap:9px; align-items:center; min-height:29px; font-size:.78rem;
    }
    .game-id { overflow:hidden; text-overflow:ellipsis; font-family:monospace; font-weight:700; }
    a.game-id {
      text-decoration-line:underline; text-decoration-color:currentColor;
      text-decoration-thickness:1px; text-underline-offset:3px;
    }
    a.game-id:hover { color:var(--accent); text-decoration-thickness:2px; }
    .game-value { color:var(--muted); font-variant-numeric:tabular-nums; }
    .game-sort {
      appearance:none; border:0; padding:2px 0; background:transparent; color:inherit;
      cursor:pointer; display:flex; gap:5px; align-items:center; font:inherit; font-weight:700;
    }
    .game-sort:hover { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
    .game-sort.active { color:var(--ink); }
    .game-sort.center { justify-content:center; }
    .game-sort.right { justify-content:flex-end; }
    .sort-indicator { display:inline-block; min-width:1em; font-size:.68rem; text-align:center; }
    .game-value:last-child { text-align:right; }
    .delta-track,.room-track { position:relative; height:18px; border-radius:5px; background:#18242d08; }
    .delta-track::after { content:""; position:absolute; top:0; bottom:0; left:50%; width:1px; background:#18242d2e; }
    .delta-bar,.room-bar { position:absolute; top:3px; bottom:3px; border-radius:4px; min-width:1px; }
    .delta-bar.positive { left:50%; background:var(--good); }
    .delta-bar.negative { right:50%; background:var(--bad); }
    .delta-label,.room-label {
      position:absolute; inset:0; display:grid; place-items:center;
      font-size:.68rem; font-weight:800; z-index:1;
    }
    .opportunity-row {
      display:grid; grid-template-columns:120px 72px 72px minmax(180px,1fr) 180px;
      gap:9px; align-items:center; min-height:31px; font-size:.78rem;
    }
    .room-bar { left:0; background:var(--frontier); }
    .frontier-model { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
    .frontier-controls { display:flex; align-items:end; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
    .frontier-select { min-width:min(310px,70vw); }
    .frontier-controls > a { padding-bottom:9px; white-space:nowrap; }
    .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .metrics { display:grid; gap:14px; }
    .metric { display:grid; gap:6px; }
    .metric-head { display:flex; justify-content:space-between; font-size:.83rem; font-weight:700; }
    .pair { display:grid; grid-template-columns:65px minmax(0,1fr) 82px; gap:8px; align-items:center; font-size:.75rem; }
    .track { height:9px; border-radius:9px; background:#18242d0f; overflow:hidden; }
    .bar { height:100%; min-width:2px; background:var(--base); }
    .bar.candidate { background:var(--accent); }
    .right { text-align:right; font-variant-numeric:tabular-nums; }
    .efficiency { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .eff-card { padding:14px; border-radius:14px; background:#18242d09; }
    .eff-values { display:flex; justify-content:space-between; margin-top:10px; gap:12px; }
    .eff-values div { display:grid; gap:3px; }
    .eff-values span { color:var(--muted); font-size:.67rem; text-transform:uppercase; }
    .notice { border-left:4px solid var(--accent); }
    details.panel { padding:0; }
    summary { cursor:pointer; padding:18px; font-weight:700; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:"Show"; float:right; color:var(--muted); font-size:.75rem; }
    details[open] summary::after { content:"Hide"; }
    .catalog { overflow:auto; border-top:1px solid #18242d14; }
    table { width:100%; border-collapse:collapse; font-size:.8rem; }
    th,td { padding:9px 12px; border-bottom:1px solid #18242d0f; text-align:right; white-space:nowrap; }
    th { color:var(--muted); font-size:.67rem; text-transform:uppercase; }
    th:first-child,td:first-child { text-align:left; }
    .catalog-run { font-family:monospace; font-weight:700; }
    .empty { text-align:center; padding:40px; color:var(--muted); }
    @media(max-width:1000px) {
      .selectors { grid-template-columns:1fr auto 1fr; }
      .selectors .score-set-wrap { grid-column:1/-1; }
      .hero,.grid2 { grid-template-columns:1fr; }
      .opportunity-row { grid-template-columns:105px 60px 60px minmax(130px,1fr); }
      .opportunity-row .frontier-model { display:none; }
    }
    @media(max-width:600px) {
      body { padding:8px; }
      .top { align-items:flex-start; flex-direction:column; }
      .selectors { grid-template-columns:1fr; width:100%; }
      .selectors .score-set-wrap { grid-column:auto; }
      .kpis,.score-sources,.outcomes,.efficiency { grid-template-columns:1fr; }
      .game-row { grid-template-columns:105px 62px minmax(110px,1fr) 62px; }
      .opportunity-row { grid-template-columns:80px 55px 55px minmax(90px,1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <h1>Inference and Score Comparison</h1>
        <div class="muted" id="subtitle">Loading scored runs...</div>
      </div>
      <a class="back" href="/">Back to viewer</a>
    </header>

    <section class="panel selectors" id="selectors" hidden>
      <div class="select-wrap">
        <label for="baseline-select">Baseline run</label>
        <select id="baseline-select"></select>
      </div>
      <button class="pill" id="swap-button" type="button" aria-label="Swap selected runs">Swap</button>
      <div class="select-wrap">
        <label for="candidate-select">Candidate run</label>
        <select id="candidate-select"></select>
      </div>
      <div class="select-wrap score-set-wrap">
        <label for="score-set-select">Detailed score set</label>
        <select id="score-set-select"></select>
      </div>
    </section>

    <div id="dashboard" class="panel empty">Loading comparison registry...</div>
  </main>

  <script>
    let registry = null;
    let baselineId = "";
    let candidateId = "";
    let scoreSet = "public";
    let gameMetric = "score";
    let frontierReference = "best";
    let gameSortKey = "delta";
    let gameSortDirection = "desc";

    const metricDefinitions = {
      score: { label: "Score", field: "score", digits: 2 },
      actions: { label: "Mean actions", field: "actions_mean", digits: 1 },
      turns: { label: "Mean turns", field: "turns_mean", digits: 1 },
      tokens: { label: "Mean tokens", field: "total_tokens_mean", digits: 0 },
    };

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
    }

    function formatNumber(value, digits) {
      if (value == null || value === "") return "-";
      const number = Number(value);
      if (!Number.isFinite(number)) return "-";
      const precision = digits == null ? (Math.abs(number) >= 100 ? 0 : 2) : digits;
      return number.toLocaleString(undefined, {
        maximumFractionDigits: precision,
        minimumFractionDigits: precision,
      });
    }

    function formatSigned(value, suffix, digits) {
      if (value == null || value === "") return "-";
      const number = Number(value);
      if (!Number.isFinite(number)) return "-";
      return (number > 0 ? "+" : "") + formatNumber(number, digits == null ? 1 : digits) + (suffix || "");
    }

    function percentChange(baseline, candidate) {
      const before = Number(baseline);
      return Number.isFinite(before) && before !== 0
        ? (Number(candidate) - before) / before * 100
        : null;
    }

    function localRunId(path) {
      const parts = String(path || "").split("/").filter(Boolean);
      if (!parts.length) return "";
      if (parts[parts.length - 1].endsWith(".json")) parts.pop();
      return parts.length ? parts[parts.length - 1] : "";
    }

    function publicScore(runId) {
      const entry = registry.runs[runId] || {};
      return entry.scores && entry.scores.public ? entry.scores.public.score : entry.score;
    }

    function linkedSemiPrivate(runId) {
      return (registry.semi_private_scores || [])
        .filter((item) => localRunId(item.local_run_path) === runId)
        .sort((a, b) => String(a.pulled_at || "").localeCompare(String(b.pulled_at || "")));
    }

    function semiPrivateScore(runId) {
      const items = linkedSemiPrivate(runId);
      return items.length ? items[items.length - 1].score : null;
    }

    function runScore(runId, requestedSet) {
      return requestedSet === "semi_private" ? semiPrivateScore(runId) : publicScore(runId);
    }

    function runLabel(runId) {
      const score = publicScore(runId) || semiPrivateScore(runId) || {};
      const createdAt = score.metadata && score.metadata.created_at;
      return createdAt ? runId + " / " + createdAt.slice(0, 10) : runId;
    }

    function scoreSetLabel(key) {
      const configured = registry.score_sets && registry.score_sets[key];
      return configured && configured.label ? configured.label : key;
    }

    function taskUrl(gameId) {
      const baseId = String(gameId).split("-")[0];
      const frontierGame = registry.public_frontier && registry.public_frontier.games
        ? registry.public_frontier.games[baseId]
        : null;
      return frontierGame && frontierGame.task_url
        ? frontierGame.task_url
        : "https://arcprize.org/tasks/" + encodeURIComponent(baseId);
    }

    function efficiency(score) {
      const mean = score && score.usage ? score.usage.mean || {} : {};
      return {
        tokens: Number(score && score.score) / (Number(mean.total_tokens) / 1000000),
        turns: Number(score && score.score) / (Number(mean.turns) / 100),
        actions: Number(score && score.score) / (Number(mean.actions) / 100),
      };
    }

    function commonGames(baseline, candidate) {
      return Object.keys((baseline && baseline.games) || {})
        .filter((gameId) => candidate && candidate.games && candidate.games[gameId])
        .map((gameId) => ({
          gameId: gameId,
          baseline: baseline.games[gameId],
          candidate: candidate.games[gameId],
        }));
    }

    function median(values) {
      if (!values.length) return null;
      const sorted = values.slice().sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
    }

    function metricCard(label, baseline, candidate, lowerIsBetter) {
      const change = percentChange(baseline, candidate);
      const good = change == null || change === 0 ? "" :
        (((lowerIsBetter !== false) ? change < 0 : change > 0) ? "good" : "bad");
      return '<article class="kpi"><div class="label">' + escapeHtml(label) + '</div>' +
        '<div class="value">' + formatNumber(candidate) + '</div>' +
        '<div class="change ' + good + '">' + formatSigned(change, "%", 1) +
        ' vs ' + formatNumber(baseline) + '</div></article>';
    }

    function sourceCard(key, baseline, candidate) {
      const active = key === scoreSet ? " active" : "";
      const before = baseline ? baseline.score : null;
      const after = candidate ? candidate.score : null;
      const available = before != null && after != null &&
        Number.isFinite(Number(before)) && Number.isFinite(Number(after));
      const delta = available ? Number(after) - Number(before) : null;
      return '<article class="source-card' + active + '"><div class="label">' +
        escapeHtml(scoreSetLabel(key)) + '</div><div class="source-values"><span>' +
        formatNumber(before, 2) + '</span><span>to</span><strong>' + formatNumber(after, 2) +
        '</strong></div><div class="change ' + (delta > 0 ? "good" : delta < 0 ? "bad" : "") + '">' +
        (available ? formatSigned(delta, "", 2) : "Link both runs to compare") + '</div></article>';
    }

    function pairedMetrics(metrics, definitions) {
      return '<div class="metrics">' + definitions.map((definition) => {
        const metric = metrics[definition.key] || {};
        const max = Math.max(Math.abs(Number(metric.baseline) || 0), Math.abs(Number(metric.candidate) || 0), 1);
        const change = percentChange(metric.baseline, metric.candidate);
        return '<div class="metric"><div class="metric-head"><span>' + escapeHtml(definition.label) +
          '</span><span class="muted">' + formatSigned(change, "%", 1) + '</span></div>' +
          '<div class="pair"><span>Baseline</span><div class="track"><div class="bar" style="width:' +
          (Math.abs(Number(metric.baseline) || 0) / max * 100) + '%"></div></div><span class="right">' +
          formatNumber(metric.baseline, definition.digits) + '</span></div>' +
          '<div class="pair"><span>Candidate</span><div class="track"><div class="bar candidate" style="width:' +
          (Math.abs(Number(metric.candidate) || 0) / max * 100) + '%"></div></div><span class="right">' +
          formatNumber(metric.candidate, definition.digits) + '</span></div></div>';
      }).join("") + '</div>';
    }

    function efficiencyCard(label, key, baseline, candidate) {
      const before = efficiency(baseline)[key];
      const after = efficiency(candidate)[key];
      const change = percentChange(before, after);
      return '<article class="eff-card"><h3>' + escapeHtml(label) + '</h3>' +
        '<div class="change ' + (change > 0 ? "good" : change < 0 ? "bad" : "") + '">' +
        formatSigned(change, "%", 1) + '</div><div class="eff-values">' +
        '<div><strong>' + formatNumber(before, 2) + '</strong><span>Baseline</span></div>' +
        '<div><strong>' + formatNumber(after, 2) + '</strong><span>Candidate</span></div></div></article>';
    }

    function compareGameRows(a, b) {
      let comparison = 0;
      if (gameSortKey === "gameId") {
        comparison = a.gameId.localeCompare(b.gameId, undefined, { numeric:true, sensitivity:"base" });
      } else {
        comparison = Number(a[gameSortKey]) - Number(b[gameSortKey]);
      }
      if (comparison === 0) {
        return a.gameId.localeCompare(b.gameId, undefined, { numeric:true, sensitivity:"base" });
      }
      return gameSortDirection === "asc" ? comparison : -comparison;
    }

    function updateGameSortHeaders() {
      const labels = {
        gameId:"game ID", baselineValue:"baseline", delta:"candidate minus baseline", candidateValue:"candidate",
      };
      document.querySelectorAll(".game-sort").forEach((button) => {
        const active = button.dataset.gameSort === gameSortKey;
        const indicator = button.querySelector(".sort-indicator");
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
        button.setAttribute("aria-label", "Sort by " + labels[button.dataset.gameSort] +
          (active ? ", currently " + (gameSortDirection === "asc" ? "ascending" : "descending") : ""));
        if (indicator) indicator.textContent = active ? (gameSortDirection === "asc" ? "▲" : "▼") : "↕";
      });
    }

    function renderGameChart(games) {
      const target = document.getElementById("game-chart");
      if (!target) return;
      const definition = metricDefinitions[gameMetric];
      const rows = games.map((game) => {
        const baseline = Number(game.baseline[definition.field]);
        const candidate = Number(game.candidate[definition.field]);
        return { gameId:game.gameId, baselineValue:baseline, candidateValue:candidate, delta:candidate - baseline };
      }).filter((row) => Number.isFinite(row.delta))
        .sort(compareGameRows);

      const maxDelta = Math.max.apply(null, rows.map((row) => Math.abs(row.delta)).concat([1]));
      target.innerHTML = rows.length ? rows.map((row) => {
        const width = Math.abs(row.delta) / maxDelta * 49;
        const direction = row.delta >= 0 ? "positive" : "negative";
        return '<div class="game-row"><a class="game-id" target="_blank" rel="noopener" href="' +
          escapeHtml(taskUrl(row.gameId)) + '" title="' + escapeHtml(row.gameId) + '">' +
          escapeHtml(row.gameId) + '</a><span class="game-value">' +
          formatNumber(row.baselineValue, definition.digits) + '</span><div class="delta-track">' +
          '<span class="delta-bar ' + direction + '" style="width:' + width + '%"></span>' +
          '<span class="delta-label">' + formatSigned(row.delta, "", definition.digits) + '</span></div>' +
          '<span class="game-value">' + formatNumber(row.candidateValue, definition.digits) + '</span></div>';
      }).join("") : '<div class="empty">No common per-game values for this metric.</div>';

      document.querySelectorAll(".metric-tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.metric === gameMetric);
      });
      updateGameSortHeaders();
    }

    function frontierSection(runId) {
      const frontier = registry.public_frontier;
      const candidate = publicScore(runId);
      if (!frontier || !frontier.games || !candidate || !candidate.games) return "";

      const configOrder = frontier.config_order || Object.keys(frontier.configs || {});
      const configEntries = configOrder.map((configId) => ({
        configId:configId, config:(frontier.configs || {})[configId],
      })).filter((entry) => entry.config);
      if (frontierReference !== "best" && !configEntries.some((entry) => entry.configId === frontierReference)) {
        frontierReference = "best";
      }
      const selectedConfig = frontierReference === "best"
        ? null
        : (frontier.configs || {})[frontierReference];
      const referenceLabel = selectedConfig ? selectedConfig.display_name : "Best per game (oracle)";
      const referenceScore = Number(selectedConfig ? selectedConfig.overall_score : frontier.oracle_score);
      const candidateOverall = Number(candidate.score);
      const overallGap = Number.isFinite(referenceScore) && Number.isFinite(candidateOverall)
        ? referenceScore - candidateOverall
        : null;

      const localByBase = {};
      Object.entries(candidate.games).forEach(([gameId, value]) => {
        localByBase[String(gameId).split("-")[0]] = value;
      });
      const rows = Object.entries(frontier.games).map(([baseId, game]) => {
        const local = localByBase[baseId];
        const reference = frontierReference === "best"
          ? game && game.best
          : game && game.models && game.models[frontierReference];
        if (!local || !reference) return null;
        const ourScore = Number(local.score);
        const frontierScore = Number(reference.score);
        if (!Number.isFinite(ourScore) || !Number.isFinite(frontierScore)) return null;
        return {
          baseId:baseId, ourScore:ourScore, frontierScore:frontierScore,
          gap:frontierScore - ourScore, game:game, reference:reference,
          referenceName:selectedConfig ? selectedConfig.display_name : reference.display_name,
        };
      }).filter(Boolean).sort((a, b) => b.gap - a.gap);

      if (!rows.length) return "";
      const maxRoom = Math.max.apply(null, rows.map((row) => Math.max(row.gap, 0)).concat([1]));
      const atOrAbove = rows.filter((row) => row.gap <= 0).length;
      const frontierRows = rows.map((row) => {
        const width = Math.max(row.gap, 0) / maxRoom * 100;
        const replay = row.reference.replay_url
          ? '<a target="_blank" rel="noopener" href="' + escapeHtml(row.reference.replay_url) + '">' +
            escapeHtml(row.referenceName) + '</a>'
          : escapeHtml(row.referenceName);
        return '<div class="opportunity-row"><a class="game-id" target="_blank" rel="noopener" href="' +
          escapeHtml(row.game.task_url) + '">' + escapeHtml(row.baseId) + '</a><span>' +
          formatNumber(row.ourScore, 2) + '</span><span>' + formatNumber(row.frontierScore, 2) +
          '</span><div class="room-track"><span class="room-bar" style="width:' + width +
          '%"></span><span class="room-label">' + formatSigned(row.gap, "", 2) +
          '</span></div><span class="frontier-model">' + replay + '</span></div>';
      }).join("");


      const referenceOptions = ['<option value="best"' + (frontierReference === "best" ? " selected" : "") +
        '>Best per game (oracle) — ' + formatNumber(frontier.oracle_score, 2) + '</option>'].concat(
        configEntries.map((entry) =>
          '<option value="' + escapeHtml(entry.configId) + '"' +
          (frontierReference === entry.configId ? " selected" : "") + '>' +
          escapeHtml(entry.config.display_name) + ' — ' + formatNumber(entry.config.overall_score, 2) + '</option>'
        )
      ).join("");
      const comparisonDescription = frontierReference === "best"
        ? "the best featured-model result available for each individual game"
        : escapeHtml(referenceLabel) + " on every game";

      return '<section class="panel"><div class="head"><div><h2>Public frontier opportunity</h2>' +
        '<div class="note">Candidate public score versus ' + comparisonDescription +
        '. Largest positive gaps are the clearest room to improve.</div></div>' +
        '<div class="frontier-controls"><div class="select-wrap frontier-select"><label for="frontier-model-select">Frontier reference</label>' +
        '<select id="frontier-model-select">' + referenceOptions + '</select></div>' +
        '<a target="_blank" rel="noopener" href="' + escapeHtml(frontier.source_url) + '">ARC Prize tasks</a></div></div>' +
        '<div class="outcomes"><article class="outcome"><div class="label">Candidate public</div><div class="value">' +
        formatNumber(candidate.score, 2) + '</div></article><article class="outcome"><div class="label">Frontier reference</div>' +
        '<div class="value">' + formatNumber(referenceScore, 2) + '</div><div class="note">' + escapeHtml(referenceLabel) +
        '</div></article><article class="outcome"><div class="label">Overall room</div><div class="value">' +
        formatSigned(overallGap, "", 2) + '</div><div class="note">Frontier minus candidate</div></article>' +
        '<article class="outcome"><div class="label">At / above reference</div>' +
        '<div class="value good">' + atOrAbove + ' / ' + rows.length + '</div></article></div>' +
        '<div class="opportunity-row muted" style="margin-top:14px"><span>Game</span><span>Ours</span><span>Frontier</span>' +
        '<span style="text-align:center">Frontier minus ours</span><span class="frontier-model">Reference model</span></div>' +
        '<div class="opportunity-chart">' + frontierRows + '</div><div class="note" style="margin-top:10px">Snapshot: ' +
        escapeHtml(String(frontier.fetched_at || "").slice(0, 19)) + '. All ' + rows.length +
        ' games are shown. Click a game to play it; click a reference model to view its replay.</div></section>';
    }

    function renderCatalog() {
      const order = registry.run_order || Object.keys(registry.runs);
      return order.map((runId) => {
        const pub = publicScore(runId);
        const linked = linkedSemiPrivate(runId);
        const semi = linked.length ? linked[linked.length - 1].score : null;
        const mean = pub && pub.usage ? pub.usage.mean || {} : {};
        const selected = runId === baselineId ? "Baseline" : runId === candidateId ? "Candidate" : "";
        return '<tr><td class="catalog-run">' + escapeHtml(runId) + '</td><td>' +
          escapeHtml(selected) + '</td><td>' + formatNumber(pub && pub.score, 3) + '</td><td>' +
          formatNumber(semi && semi.score, 3) + '</td><td>' + linked.length + '</td><td>' +
          formatNumber(mean.total_tokens, 0) + '</td></tr>';
      }).join("");
    }

    function unlinkedImportsSection() {
      const unlinked = (registry.semi_private_scores || []).filter((item) => !String(item.local_run_path || "").trim());
      if (!unlinked.length) return "";
      const rows = unlinked.map((item) =>
        '<tr><td class="catalog-run">' + escapeHtml(item.id) + '</td><td>' +
        escapeHtml(String(item.pulled_at || "").slice(0, 19)) + '</td><td>' +
        escapeHtml(item.source_label || "") + '</td><td>' + formatNumber(item.score && item.score.score, 3) +
        '</td><td><code>local_run_path: ""</code></td></tr>'
      ).join("");
      return '<details class="panel notice" open><summary>' + unlinked.length +
        ' semi-private import' + (unlinked.length === 1 ? "" : "s") + ' need a local run path</summary>' +
        '<div class="catalog"><table><thead><tr><th>Import</th><th>Pulled</th><th>Source</th><th>Score</th><th>Action</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="note" style="padding:12px 18px">Edit <code>runs/inference_score_comparison.json</code> and fill each ' +
        '<code>local_run_path</code>. Imports are append-only; linking does not remove history.</div></details>';
    }

    function render() {
      const baseline = runScore(baselineId, scoreSet);
      const candidate = runScore(candidateId, scoreSet);
      if (!baseline || !candidate) {
        document.getElementById("dashboard").className = "panel empty";
        document.getElementById("dashboard").textContent =
          "Both selected runs need a linked " + scoreSetLabel(scoreSet).toLowerCase() + " score.";
        return;
      }
      const baselineInference = publicScore(baselineId) || baseline;
      const candidateInference = publicScore(candidateId) || candidate;
      const games = commonGames(baseline, candidate);
      const scoreDeltas = games.map((game) => Number(game.candidate.score) - Number(game.baseline.score))
        .filter(Number.isFinite);
      const improved = scoreDeltas.filter((delta) => delta > 1e-9).length;
      const regressed = scoreDeltas.filter((delta) => delta < -1e-9).length;
      const tied = scoreDeltas.length - improved - regressed;
      const scoreDelta = Number(candidate.score) - Number(baseline.score);
      const scoreChange = percentChange(baseline.score, candidate.score);
      const baselineMean = baselineInference.usage ? baselineInference.usage.mean || {} : {};
      const candidateMean = candidateInference.usage ? candidateInference.usage.mean || {} : {};
      const serverMetrics = {
        prompt: {
          baseline: baselineInference.server && baselineInference.server.prompt_throughput_tokens_per_s
            ? baselineInference.server.prompt_throughput_tokens_per_s.mean : null,
          candidate: candidateInference.server && candidateInference.server.prompt_throughput_tokens_per_s
            ? candidateInference.server.prompt_throughput_tokens_per_s.mean : null,
        },
        generation: {
          baseline: baselineInference.server && baselineInference.server.generation_throughput_tokens_per_s
            ? baselineInference.server.generation_throughput_tokens_per_s.mean : null,
          candidate: candidateInference.server && candidateInference.server.generation_throughput_tokens_per_s
            ? candidateInference.server.generation_throughput_tokens_per_s.mean : null,
        },
        prefix: {
          baseline: baselineInference.server && baselineInference.server.prefix_cache_hit_rate_pct
            ? baselineInference.server.prefix_cache_hit_rate_pct.mean : null,
          candidate: candidateInference.server && candidateInference.server.prefix_cache_hit_rate_pct
            ? candidateInference.server.prefix_cache_hit_rate_pct.mean : null,
        },
        kv: {
          baseline: baselineInference.server && baselineInference.server.gpu_kv_cache_usage_pct
            ? baselineInference.server.gpu_kv_cache_usage_pct.mean : null,
          candidate: candidateInference.server && candidateInference.server.gpu_kv_cache_usage_pct
            ? candidateInference.server.gpu_kv_cache_usage_pct.mean : null,
        },
      };

      const dashboard = document.getElementById("dashboard");
      dashboard.className = "";
      dashboard.innerHTML =
        unlinkedImportsSection() +
        '<section class="hero"><article class="score"><div class="eyebrow">' +
        escapeHtml(scoreSetLabel(scoreSet)) + ' overall score</div><div class="score-line"><span class="score-old">' +
        formatNumber(baseline.score, 2) + '</span><span>to</span><span class="score-new">' +
        formatNumber(candidate.score, 2) + '</span></div><div class="score-change">' +
        formatSigned(scoreDelta, "", 2) + ' (' + formatSigned(scoreChange, "%", 1) + ')</div>' +
        '<div class="run-names"><span>Baseline: ' + escapeHtml(baselineId) +
        '</span><span>Candidate: ' + escapeHtml(candidateId) + '</span></div></article>' +
        '<div style="display:grid;gap:10px"><div class="score-sources">' +
        sourceCard("public", publicScore(baselineId), publicScore(candidateId)) +
        sourceCard("semi_private", semiPrivateScore(baselineId), semiPrivateScore(candidateId)) +
        '</div><div class="kpis">' +
        metricCard("Mean actions / public trial", baselineMean.actions, candidateMean.actions) +
        metricCard("Mean turns / public trial", baselineMean.turns, candidateMean.turns) +
        metricCard("Mean tokens / public trial", baselineMean.total_tokens, candidateMean.total_tokens) +
        metricCard("Tokens / action", baselineMean.tokens_per_action, candidateMean.tokens_per_action) +
        '</div></div></section>' +

        '<section class="panel"><div class="head"><div><h2>All-game outcome</h2>' +
        '<div class="note">' + games.length + ' common ' + escapeHtml(scoreSetLabel(scoreSet).toLowerCase()) +
        ' games. Inference usage always comes from the local public run.</div></div></div>' +
        '<div class="outcomes"><article class="outcome"><div class="label">Improved</div><div class="value good">' +
        improved + '</div></article><article class="outcome"><div class="label">Regressed</div><div class="value bad">' +
        regressed + '</div></article><article class="outcome"><div class="label">Tied</div><div class="value">' +
        tied + '</div></article><article class="outcome"><div class="label">Median score delta</div><div class="value">' +
        formatSigned(median(scoreDeltas), "", 2) + '</div></article></div></section>' +

        '<section class="panel"><div class="head"><div><h2>Game-by-game run comparison</h2>' +
        '<div class="note">Click a column header to sort. Every underlined game ID opens its ARC Prize play page.</div></div>' +
        '<div class="metric-tabs">' + Object.entries(metricDefinitions).map(([key, definition]) =>
          '<button class="metric-tab ' + (key === gameMetric ? "active" : "") +
          '" data-metric="' + key + '">' + escapeHtml(definition.label) + '</button>'
        ).join("") + '</div></div><div class="game-row muted">' +
        '<button type="button" class="game-sort" data-game-sort="gameId">Game ID <span class="sort-indicator" aria-hidden="true"></span></button>' +
        '<button type="button" class="game-sort" data-game-sort="baselineValue">Baseline <span class="sort-indicator" aria-hidden="true"></span></button>' +
        '<button type="button" class="game-sort center" data-game-sort="delta">Candidate minus baseline <span class="sort-indicator" aria-hidden="true"></span></button>' +
        '<button type="button" class="game-sort right" data-game-sort="candidateValue">Candidate <span class="sort-indicator" aria-hidden="true"></span></button>' +
        '</div><div class="game-chart" id="game-chart"></div></section>' +

        frontierSection(candidateId) +

        '<section class="panel"><div class="head"><div><h2>Public score efficiency</h2>' +
        '<div class="note">Higher means more public score for the same local inference budget.</div></div></div>' +
        '<div class="efficiency">' +
        efficiencyCard("Per 1M mean tokens", "tokens", baselineInference, candidateInference) +
        efficiencyCard("Per 100 mean turns", "turns", baselineInference, candidateInference) +
        efficiencyCard("Per 100 mean actions", "actions", baselineInference, candidateInference) +
        '</div></section>' +

        '<div class="grid2"><section class="panel"><div class="head"><h2>Local inference usage</h2></div>' +
        pairedMetrics({
          actions:{baseline:baselineMean.actions,candidate:candidateMean.actions},
          turns:{baseline:baselineMean.turns,candidate:candidateMean.turns},
          tokens:{baseline:baselineMean.total_tokens,candidate:candidateMean.total_tokens},
          tokensAction:{baseline:baselineMean.tokens_per_action,candidate:candidateMean.tokens_per_action},
          tokensTurn:{baseline:baselineMean.tokens_per_turn,candidate:candidateMean.tokens_per_turn},
        }, [
          {key:"actions",label:"Actions",digits:1},
          {key:"turns",label:"Turns",digits:1},
          {key:"tokens",label:"Total tokens",digits:0},
          {key:"tokensAction",label:"Tokens / action",digits:0},
          {key:"tokensTurn",label:"Tokens / turn",digits:0},
        ]) + '</section><section class="panel"><div class="head"><h2>Serving behavior</h2></div>' +
        pairedMetrics(serverMetrics, [
          {key:"prompt",label:"Prompt throughput / tok/s",digits:0},
          {key:"generation",label:"Generation throughput / tok/s",digits:1},
          {key:"prefix",label:"Prefix cache hit / %",digits:1},
          {key:"kv",label:"GPU KV cache use / %",digits:1},
        ]) + '</section></div>' +

        '<details class="panel"><summary>All Qwen 3.8-era scored runs (' +
        (registry.run_order ? registry.run_order.length : Object.keys(registry.runs).length) +
        ')</summary><div class="catalog"><table><thead><tr><th>Run</th><th>Selected as</th>' +
        '<th>Public score</th><th>Semi-private score</th><th>Linked imports</th><th>Mean public tokens</th></tr></thead>' +
        '<tbody>' + renderCatalog() + '</tbody></table></div></details>';

      const frontierModelSelect = document.getElementById("frontier-model-select");
      if (frontierModelSelect) {
        frontierModelSelect.addEventListener("change", () => {
          frontierReference = frontierModelSelect.value;
          render();
        });
      }
      document.querySelectorAll(".metric-tab").forEach((button) => {
        button.addEventListener("click", () => {
          gameMetric = button.dataset.metric;
          renderGameChart(games);
        });
      });
      document.querySelectorAll(".game-sort").forEach((button) => {
        button.addEventListener("click", () => {
          const requestedKey = button.dataset.gameSort;
          if (requestedKey === gameSortKey) {
            gameSortDirection = gameSortDirection === "asc" ? "desc" : "asc";
          } else {
            gameSortKey = requestedKey;
            gameSortDirection = requestedKey === "gameId" ? "asc" : "desc";
          }
          renderGameChart(games);
        });
      });
      renderGameChart(games);
    }

    function refreshScoreSetSelector() {
      const selector = document.getElementById("score-set-select");
      const availability = {
        public: Boolean(publicScore(baselineId) && publicScore(candidateId)),
        semi_private: Boolean(semiPrivateScore(baselineId) && semiPrivateScore(candidateId)),
      };
      if (!availability[scoreSet]) scoreSet = availability.public ? "public" : "semi_private";
      selector.innerHTML = ["public", "semi_private"].map((key) =>
        '<option value="' + key + '"' + (availability[key] ? "" : " disabled") + '>' +
        escapeHtml(scoreSetLabel(key)) + (availability[key] ? "" : " (link both runs)") + '</option>'
      ).join("");
      selector.value = scoreSet;
    }

    function populateSelectors() {
      const order = registry.run_order || Object.keys(registry.runs);
      if (order.length < 2) throw new Error("At least two post-2026-08-10 scored runs are required.");
      baselineId = order[order.length - 2];
      candidateId = order[order.length - 1];
      const options = order.map((runId) =>
        '<option value="' + escapeHtml(runId) + '">' + escapeHtml(runLabel(runId)) + '</option>'
      ).join("");
      const baselineSelect = document.getElementById("baseline-select");
      const candidateSelect = document.getElementById("candidate-select");
      const scoreSetSelect = document.getElementById("score-set-select");
      baselineSelect.innerHTML = options;
      candidateSelect.innerHTML = options;
      baselineSelect.value = baselineId;
      candidateSelect.value = candidateId;
      refreshScoreSetSelector();

      baselineSelect.addEventListener("change", () => {
        const previous = baselineId;
        baselineId = baselineSelect.value;
        if (baselineId === candidateId) {
          candidateId = previous;
          candidateSelect.value = candidateId;
        }
        refreshScoreSetSelector();
        render();
      });
      candidateSelect.addEventListener("change", () => {
        const previous = candidateId;
        candidateId = candidateSelect.value;
        if (candidateId === baselineId) {
          baselineId = previous;
          baselineSelect.value = baselineId;
        }
        refreshScoreSetSelector();
        render();
      });
      scoreSetSelect.addEventListener("change", () => {
        scoreSet = scoreSetSelect.value;
        render();
      });
      document.getElementById("swap-button").addEventListener("click", () => {
        const previous = baselineId;
        baselineId = candidateId;
        candidateId = previous;
        baselineSelect.value = baselineId;
        candidateSelect.value = candidateId;
        refreshScoreSetSelector();
        render();
      });
      document.getElementById("selectors").hidden = false;
    }

    fetch("/api/comparison", { cache:"no-store" })
      .then((response) => response.json().then((body) => {
        if (!response.ok) throw new Error(body.error || "Failed to load score registry.");
        return body;
      }))
      .then((body) => {
        if (body.version !== 3 || !body.runs) {
          throw new Error("Comparison registry must be regenerated in version-3 format.");
        }
        registry = body;
        const cutoff = String(body.minimum_run_date || "20260810");
        document.getElementById("subtitle").textContent =
          (body.run_order || Object.keys(body.runs)).length + " scored runs on/after " +
          cutoff.slice(0, 4) + "-" + cutoff.slice(4, 6) + "-" + cutoff.slice(6, 8);
        populateSelectors();
        render();
      })
      .catch((error) => {
        document.getElementById("dashboard").textContent = error.message;
      });
  </script>
</body>
</html>
